name: Integration (multi-distro)

# Runs BOB inside containers of multiple Linux distributions to catch
# regressions that unit tests can't reach: locale fallback sentinels,
# distro-specific subprocess assumptions, missing-tool handling on
# non-Debian families.
#
# Scope: smoke + offline audit run. Does NOT verify scoring correctness
# (containers have no firewall / no real services), only that BOB exits
# cleanly without sentinels or Python tracebacks.

on:
  push:
    # Fire on main + release-branch pushes so the smoke-plugin guard
    # (added v0.7.0b5) actually runs during beta cycles, not just after
    # v*.x merges back to main. Without this, the new integration-level
    # plugin smoke would be dormant for the entire v0.7.x development
    # window — which is exactly the window the v0.7.0b3 regression hit.
    branches: [main, "v*.x"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 0.28.2 — the token's rights said here, not inherited from the repository
# setting (read today); a newer push to the same ref cancels the older run.
permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:12
            family: debian
          - distro: debian:13
            family: debian
          - distro: ubuntu:22.04
            family: debian
          - distro: ubuntu:24.04
            family: debian
          # 0.28.2 — ubuntu:25.04 (end of life 17 January 2026) and fedora:41
          # (end of life 15 December 2025) replaced by the releases BOB is
          # validated on (Tier 1), and the two Tier 1 families CI did not run:
          # Alpine (musl, BusyBox, OpenRC) and openSUSE (zypper). Measured in
          # podman before adding them: every step below passed on each.
          - distro: ubuntu:26.04
            family: debian
          - distro: kalilinux/kali-rolling
            family: debian
          - distro: fedora:44
            family: fedora
          - distro: alpine:3.24
            family: alpine
          - distro: opensuse/leap:16.0
            family: suse

    container:
      image: ${{ matrix.distro }}

    steps:
      - name: Install system deps (Debian/Ubuntu/Kali)
        if: matrix.family == 'debian'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # Kali rolling rotates packages aggressively — `apt-get update` may
          # cache references to .debs that 404 by the time `apt-get install`
          # runs. Retry once with a fresh package list before giving up.
          # 0.28.0 — the step fails itself when every attempt failed: the loop
          # used to end on `sleep 5`, so a mirror down (Kali, 25 October 2026,
          # twice) passed here and surfaced one step later as exit 127.
          ok=""
          for attempt in 1 2 3; do
            if apt-get update -qq && apt-get install -y --no-install-recommends \
                 python3 python3-pip python3-venv git ca-certificates; then
              ok=1
              break
            fi
            echo "::warning::apt attempt $attempt failed, retrying after 5s..."
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::apt could not install python3, pip, venv and git after 3 attempts (a mirror unreachable?)"
            exit 1
          fi

      - name: Install system deps (Fedora)
        if: matrix.family == 'fedora'
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-pip git ca-certificates

      - name: Install system deps (Alpine)
        if: matrix.family == 'alpine'
        run: apk add --no-cache python3 py3-pip git ca-certificates

      - name: Install system deps (openSUSE)
        if: matrix.family == 'suse'
        run: zypper -n --gpg-auto-import-keys install python3 python3-pip git-core ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install BOB from source (in venv)
        # Use a venv to sidestep PEP 668 / --break-system-packages:
        #   - Ubuntu 22.04 ships pip 22.x which doesn't know that flag.
        #   - Debian 13 / Ubuntu 24+ / Kali require it (apt-installed pip
        #     has no RECORD file → pip refuses uninstall on upgrade).
        # A venv is a clean, distro-independent install location.
        #
        # CRITICAL (v0.6.2 hotfix): `pip install .` (non-editable) so the
        # wheel is actually built. `pip install -e .` (editable) puts the
        # repo root on sys.path and bypasses the [tool.setuptools.packages]
        # config — packaging-config bugs go undetected. The v0.6.0 splits
        # of bob/checks/ssh/ and bob/cron/ shipped a wheel missing those
        # subpackages because the include= list was a stale literal; the
        # bug only surfaced after pipx install on a user system.
        #
        # 0.28.2 — the venv's own pip is the distribution's (openSUSE Leap 16:
        # 26.1.2, still trusting eMudhra / emSign): pip 26.2.2 is installed into
        # it by hash first, then setuptools pinned by hash
        # (requirements-build.txt), and BOB is built against that setuptools
        # (--no-build-isolation) — a hashed PIP_CONSTRAINT cannot be used here,
        # pip then refuses the local project, which has no file to hash
        # (measured). Measured on all nine images of the matrix in podman.
        run: |
          python3 -m venv /opt/bobenv
          /opt/bobenv/bin/python -m pip install --disable-pip-version-check "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          /opt/bobenv/bin/pip install --require-hashes -r requirements-build.txt
          /opt/bobenv/bin/pip install --no-build-isolation .
          echo "/opt/bobenv/bin" >> "$GITHUB_PATH"

      - name: Smoke — packaging includes all subpackages
        # Catches the v0.6.0 class of bug: a refactor adds a new subpackage
        # but the wheel doesn't include it. The `pip install .` step above
        # builds the wheel; this step imports each subpackage explicitly so
        # any missing module surfaces as a clean failure here, not at
        # runtime on a user system.
        run: |
          python3 -c "import bob.checks.ssh; from bob.checks.ssh import check_ssh, SSHSnapshot"
          python3 -c "import bob.cron; from bob.cron import CronEntry, run_install_cron, _atomic_write"
          python3 -c "from bob._atomic import atomic_write"
          python3 -c "from bob._tty import safe_input, prompt_wizard, read_line"

      - name: Smoke — bob --version
        run: bob --version

      - name: Smoke — bob --help
        run: bob --help > /dev/null

      - name: Smoke — bob --explain known key
        run: bob --explain firewall.inactive > /dev/null

      - name: Smoke — plugin sandbox runner via real bob binary
        # Catches the v0.7.0b3 class of bug: a sandbox refactor that's
        # correct on the maintainer's primary Python but breaks on other
        # CPython versions / non-editable wheel installs. The b3 5/5 VM
        # validation pattern smoked the audit chain end-to-end on real
        # distros, but no VM had ~/.config/bob/checks.d/ populated, so
        # the sandbox path was never instantiated and a regression
        # (MappingProxyType → SystemError) shipped to a tag before being
        # caught by the pytest workflow. This step drops a benign
        # plugin into the standard discovery dir, so the audit chain
        # MUST instantiate SandboxRunner. Asserts the plugin's section
        # title + OK finding both appear in the audit output.
        run: |
          mkdir -p "$HOME/.config/bob/checks.d"
          cat > "$HOME/.config/bob/checks.d/ci_smoke.py" <<'PLUGIN_EOF'
          """CI smoke plugin — benign, exercises the sandbox runner."""
          from bob.scoring import CheckResult

          CHECK_NAME = "CI SMOKE PLUGIN"

          def run_check(t=None):
              # Exercise import allowlist (re/json/pathlib are allowed).
              import re, json, pathlib
              r = CheckResult()
              r.ok(message="plugin executed inside sandbox")
              return r
          PLUGIN_EOF

          # Plugin must appear in the audit and not crash with SystemError.
          set +e
          bob --offline -v > plugin_audit.txt 2>&1
          rc=$?
          set -e
          echo "BOB exit code: $rc"

          if ! grep -q "CI SMOKE PLUGIN" plugin_audit.txt; then
            echo "FAIL: plugin section title not in audit output — discovery broken"
            echo "--- plugin_audit.txt (last 80 lines) ---"
            tail -n 80 plugin_audit.txt
            exit 1
          fi

          if ! grep -q "plugin executed inside sandbox" plugin_audit.txt; then
            echo "FAIL: plugin OK finding missing — sandbox returned WARN/error"
            echo "--- plugin_audit.txt (last 80 lines) ---"
            tail -n 80 plugin_audit.txt
            exit 1
          fi

          if grep -q "SystemError" plugin_audit.txt; then
            echo "FAIL: SystemError surfaced in plugin output (v0.7.0b3 signature)"
            echo "--- plugin_audit.txt (last 80 lines) ---"
            tail -n 80 plugin_audit.txt
            exit 1
          fi

          # Clean up so the next "Run offline audit" step below doesn't
          # see the plugin (keeps that step's assertions stable).
          rm -rf "$HOME/.config/bob/checks.d"

      - name: Run offline audit
        id: audit
        run: |
          set +e
          bob --offline -v > audit.txt 2>&1
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "BOB exit code: $rc"
          echo "--- audit.txt (last 80 lines) ---"
          tail -n 80 audit.txt
          echo "--- end ---"

      - name: Assert exit code ≤ 3 (4 = critical config/runtime error)
        # 0.28.2 — the value comes through the environment, not expanded into
        # the script (zizmor: template-injection).
        env:
          rc: ${{ steps.audit.outputs.exit_code }}
        run: |
          if [ "$rc" -gt 3 ]; then
            echo "FAIL: BOB exit code $rc (expected 0–3 for legitimate findings)"
            echo "--- full audit.txt ---"
            cat audit.txt
            exit 1
          fi

      - name: Assert no locale sentinel keys in output
        run: |
          # BOB's i18n fallback emits "[namespace.key]" when a translation
          # key is missing. Regression test: this exact pattern in output
          # means a locale key was removed without updating its call sites.
          if grep -nE '\[[a-z_]+(\.[a-z_]+)+\]' audit.txt; then
            echo "FAIL: locale sentinel keys found in output"
            exit 1
          fi

      - name: Assert no Python traceback
        run: |
          if grep -qE '^Traceback \(most recent call last\)' audit.txt; then
            echo "FAIL: Python traceback found in BOB output"
            grep -A 40 -nE '^Traceback' audit.txt | head -n 60
            exit 1
          fi

      - name: Upload audit log (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: audit-${{ strategy.job-index }}-${{ matrix.family }}
          path: audit.txt
          retention-days: 7

  arm64:
    name: debian:bookworm-slim (arm64, emulated)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Separate from the `smoke` matrix above because GitHub's `container:`
    # key runs on the runner's own architecture and takes no platform. ARM
    # needs binfmt registration plus an explicit `docker run --platform`, so
    # the whole run lives inside one step.
    #
    # What this gate is for: BOB reasoned entirely about software until
    # v0.17.0 and stated x86 facts on boards that have no x86 in them —
    # absent UEFI was announced as "Legacy BIOS detected", which a Raspberry
    # Pi does not have either. Those are the assertions below that a
    # same-architecture job cannot make.
    #
    # Emulation is not hardware and is not silently equivalent to it:
    # setrlimit(RLIMIT_AS) returns success and applies nothing under
    # qemu-user, which is how the plugin sandbox was caught claiming a memory
    # cap it never got. The full test suite is deliberately NOT run here —
    # it takes roughly fifteen times as long under emulation, and the
    # architecture-sensitive part of it is what this job asserts directly.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Register QEMU binfmt handlers
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
        with:
          platforms: arm64
          # 0.28.2 — the action's default is tonistiigi/binfmt:latest, run
          # privileged on the runner; pinned by digest (latest = qemu-v10.2.3
          # on 30 October 2026).
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          # 0.28.2 — the action caches that image in the Actions cache by
          # default: no cache on the path that runs privileged.
          cache-image: false

      - name: Smoke + offline audit + Raspberry Pi section on arm64
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src:ro" \
            debian:bookworm-slim \
            sh -c 'mkdir -p /work && cp -r /src/. /work/ && cd /work && sh ci/arm64_smoke.sh'
