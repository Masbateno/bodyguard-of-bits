name: Publish to PyPI + GitHub Release

# Triggers on version tags pushed to main (bare SemVer, e.g. 0.25.1; legacy v* kept).
# Pipeline: tests → build (sdist + wheel) → PyPI publish (OIDC) → GitHub Release.
# If PyPI publish fails, the GitHub release is not created.
on:
  push:
    tags:
      # SemVer tags with no "v" prefix (v0.21.0 onward). The legacy "v*" form is
      # kept so the last "v"-tagged release (v0.20.5) still triggers a publish.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v*"

jobs:
  # Run the full test suite before publishing
  test:
    name: Tests — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test runner
        run: python -m pip install --disable-pip-version-check "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70" && pip install --require-hashes -r requirements-ci.txt && pip install -e .

      - name: Run tests
        run: python -m pytest tests/ --tb=short -q

  # Build the sdist + wheel
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      # 0.26.1 — after the eMudhra / emSign CA incident (October 2026): pip
      # before 26.2.2 trusts the compromised authorities, so upgrading pip
      # with the pip in place would fetch the new one over the very connection
      # at risk. pip is installed from a wheel pinned by its SHA-256 (pip checks
      # the #sha256= fragment), the job fails if pip is older than 26.2.2,
      # and only then are the build tools installed. See SECURITY.md.
      - name: Install pip from a hash-pinned wheel
        run: >-
          python -m pip install --disable-pip-version-check
          "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - name: Refuse a pip older than 26.2.2
        run: |
          python - <<'PY'
          import sys
          from importlib.metadata import version
          v = version("pip")
          print(f"pip {v}")
          if tuple(int(x) for x in v.split(".")[:3]) < (26, 2, 2):
              sys.exit(f"pip {v} still trusts the eMudhra / emSign authorities: refusing to build")
          PY

      # 0.27.0 — the release environment admits tags matching the glob
      # [0-9]*.[0-9]*.[0-9]* (fnmatch: "1x.2.3y" matches too), and the trigger
      # keeps the legacy v* form. Only a bare MAJOR.MINOR.PATCH equal to the
      # version in pyproject.toml is built, so a tag pushed before the bump
      # cannot publish the previous version under a new name.
      - name: Refuse a tag that is not this release's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["TAG"]
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", tag) or tag != version:
              sys.exit(f"tag {tag!r} is not this release's version {version!r}: refusing to build")
          print(f"tag {tag} = pyproject.toml {version}")
          PY

      - name: Install build
        run: python -m pip install --require-hashes -r requirements-ci.txt && python -m pip --version && python -m build --version

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  # Publish to PyPI via Trusted Publishing (OIDC — no API token required)
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: release
    permissions:
      id-token: write   # required for OIDC Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Pinned by commit: v1.14.3, the first release with the fix for
        # GHSA-5xjx-3w67-w9x9 (certifi trusting eMudhra / emSign). Moved on
        # purpose, never by a branch moving under us.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true

  # Create a GitHub Release with notes extracted from DOCUMENTS/CHANGELOG_FULL.md
  # and the built sdist + wheel attached as assets.
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write   # required to create the release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Extract release title and notes
        id: extract
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"   # e.g. 0.21.0 (tagless) or legacy v0.4.6
          BASE="${VERSION#v}"            # strip a legacy leading "v" for matching

          # --- Detect pre-release per PEP 440 suffix (a/b/rc/.dev followed by digits)
          IS_PRERELEASE="false"
          if [[ "$VERSION" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            IS_PRERELEASE="true"
          fi
          echo "is_prerelease=$IS_PRERELEASE"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

          # --- Body: section between "## [X.Y.Z]" (v optional, tagless from
          #           0.21.0 on) and the next "## [" header of any form, in
          #           DOCUMENTS/CHANGELOG_FULL.md (the header line is skipped).
          awk -v marker="$BASE" '
            $0 ~ "^## \\[v?" marker "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' DOCUMENTS/CHANGELOG_FULL.md > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            if [ "$IS_PRERELEASE" = "true" ]; then
              # Pre-release without a CHANGELOG section is allowed: synthesise
              # minimal notes from git log so VM validation can ship a wheel
              # without forcing a changelog edit per beta drop.
              PREV_TAG=$(git describe --tags --abbrev=0 --match='v[0-9]*' HEAD^ 2>/dev/null || echo "")
              {
                echo "## Pre-release $VERSION"
                echo ""
                echo "Pre-release build for testing. Install with:"
                echo ""
                echo '    pipx install --pip-args="--pre" bodyguard-of-bits'
                echo ""
                if [ -n "$PREV_TAG" ]; then
                  echo "### Commits since $PREV_TAG"
                  echo ""
                  git log --oneline "$PREV_TAG..HEAD" --no-decorate
                fi
              } > /tmp/notes.md
            else
              echo "::error::No release notes extracted for $VERSION."
              echo "DOCUMENTS/CHANGELOG_FULL.md must contain a section starting with:"
              echo "  ## [$BASE] — YYYY-MM-DD"
              exit 1
            fi
          fi

          # --- Title: "vX.Y.Z — <headline>", where <headline> is the BOLD LEAD
          #            of the CHANGELOG.md table row: "**<lead>.** <body...>".
          #
          # v0.15.3: this used to cut at the first " — " instead. The lead
          # itself contains em dashes ("**First v0.15.3 work — the backlog
          # v0.15.2 left.** Samba..."), so every release since at least v0.14.0
          # was titled mid-phrase and carried a stray "**":
          #     v0.15.3 — **First v0.15.3 work
          # Take the span between the first pair of "**" instead; fall back to
          # the first sentence when a row has no bold lead.
          HEADLINE=$(awk -F'|' -v ver="${VERSION#v}" '
            $2 ~ "\\[v?" ver "\\]" { print $4; exit }
          ' CHANGELOG.md)
          HEADLINE=$(printf '%s' "$HEADLINE" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          case "$HEADLINE" in
            '**'*) HEADLINE=$(printf '%s' "$HEADLINE" | sed -E 's/^\*\*//; s/\*\*.*$//') ;;
            *)     HEADLINE=$(printf '%s' "$HEADLINE" | sed -E 's/\. .*$//') ;;
          esac
          # No length cut: `cut -c` counts BYTES in GNU coreutils, so a lead
          # containing em dashes was truncated shorter than intended and could
          # split a multibyte character outright. The bold lead is the headline
          # by convention; its length is enforced on CHANGELOG.md — where a
          # human can shorten it — rather than mutilated here.
          HEADLINE=$(printf '%s' "$HEADLINE" | sed -E 's/[[:space:]]+$//; s/\.$//')

          if [ -z "$HEADLINE" ]; then
            if [ "$IS_PRERELEASE" = "true" ]; then
              TITLE="$VERSION (pre-release)"
            else
              TITLE="$VERSION"
            fi
          else
            TITLE="$VERSION — $HEADLINE"
          fi

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Title: $TITLE"
          echo "Notes (first 15 lines):"
          head -15 /tmp/notes.md
          echo "..."
          echo "Total lines: $(wc -l </tmp/notes.md)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: ${{ steps.extract.outputs.title }}
          body_path: /tmp/notes.md
          files: dist/*
          fail_on_unmatched_files: true
          # Pre-release tags (v0.7.0b1, v0.7.0a2, …) do NOT override the
          # latest-stable badge on the GitHub releases page.
          make_latest: ${{ steps.extract.outputs.is_prerelease == 'false' }}
          prerelease: ${{ steps.extract.outputs.is_prerelease == 'true' }}
