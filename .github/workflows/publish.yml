name: Publish to PyPI + GitHub Release

# Triggers on version tags pushed to main (e.g. v0.4.6).
# Pipeline: tests → build (sdist + wheel) → PyPI publish (OIDC) → GitHub Release.
# If PyPI publish fails, the GitHub release is not created.
on:
  push:
    tags:
      - "v*"

jobs:
  # Run the full test suite before publishing
  test:
    name: Tests — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test runner
        run: pip install --upgrade pip && pip install pytest beautifulsoup4 && pip install -e .

      - name: Run tests
        run: python -m pytest tests/ --tb=short -q

  # Build the sdist + wheel
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Publish to PyPI via Trusted Publishing (OIDC — no API token required)
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: release
    permissions:
      id-token: write   # required for OIDC Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Create a GitHub Release with notes extracted from DOCUMENTS/CHANGELOG_FULL.md
  # and the built sdist + wheel attached as assets.
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write   # required to create the release
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract release title and notes
        id: extract
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"   # e.g. v0.4.6 or v0.7.0b1

          # --- Detect pre-release per PEP 440 suffix (a/b/rc/.dev followed by digits)
          IS_PRERELEASE="false"
          if [[ "$VERSION" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            IS_PRERELEASE="true"
          fi
          echo "is_prerelease=$IS_PRERELEASE"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

          # --- Body: section between "## [vX.Y.Z]" and the next "## [v" header
          #           in DOCUMENTS/CHANGELOG_FULL.md (the header line itself is skipped)
          awk -v marker="$VERSION" '
            $0 ~ "^## \\[" marker "\\]" { flag=1; next }
            flag && /^## \[v/ { exit }
            flag { print }
          ' DOCUMENTS/CHANGELOG_FULL.md > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            if [ "$IS_PRERELEASE" = "true" ]; then
              # Pre-release without a CHANGELOG section is allowed: synthesise
              # minimal notes from git log so VM validation can ship a wheel
              # without forcing a changelog edit per beta drop.
              PREV_TAG=$(git describe --tags --abbrev=0 --match='v[0-9]*' HEAD^ 2>/dev/null || echo "")
              {
                echo "## Pre-release $VERSION"
                echo ""
                echo "Pre-release build for testing. Install with:"
                echo ""
                echo '    pipx install --pip-args="--pre" bodyguard-of-bits'
                echo ""
                if [ -n "$PREV_TAG" ]; then
                  echo "### Commits since $PREV_TAG"
                  echo ""
                  git log --oneline "$PREV_TAG..HEAD" --no-decorate
                fi
              } > /tmp/notes.md
            else
              echo "::error::No release notes extracted for $VERSION."
              echo "DOCUMENTS/CHANGELOG_FULL.md must contain a section starting with:"
              echo "  ## [$VERSION] — YYYY-MM-DD"
              exit 1
            fi
          fi

          # --- Title: "vX.Y.Z — <headline>" where <headline> is the text in the
          #            CHANGELOG.md table row before the first " — " separator.
          HEADLINE=$(awk -F'|' -v ver="$VERSION" '
            $2 ~ "\\[" ver "\\]" { print $4; exit }
          ' CHANGELOG.md)
          # Trim whitespace and cut at first " — "
          HEADLINE=$(printf '%s' "$HEADLINE" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s/ — .*$//')

          if [ -z "$HEADLINE" ]; then
            if [ "$IS_PRERELEASE" = "true" ]; then
              TITLE="$VERSION (pre-release)"
            else
              TITLE="$VERSION"
            fi
          else
            TITLE="$VERSION — $HEADLINE"
          fi

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Title: $TITLE"
          echo "Notes (first 15 lines):"
          head -15 /tmp/notes.md
          echo "..."
          echo "Total lines: $(wc -l </tmp/notes.md)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.extract.outputs.title }}
          body_path: /tmp/notes.md
          files: dist/*
          fail_on_unmatched_files: true
          # Pre-release tags (v0.7.0b1, v0.7.0a2, …) do NOT override the
          # latest-stable badge on the GitHub releases page.
          make_latest: ${{ steps.extract.outputs.is_prerelease == 'false' }}
          prerelease: ${{ steps.extract.outputs.is_prerelease == 'true' }}
