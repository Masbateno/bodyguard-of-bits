[profile]
name        = desktop
extends     = server
description = Desktop — relaxed hardening, manual update management assumed

[overrides]
# --- Updates & hardening ----------------------------------------------------

# unattended-upgrades is not the standard update mechanism on desktop systems
# (mintupdate, pop-upgrade, GNOME Software, etc. are used instead).
updates.unattended_not_configured = info

# Loose rp_filter (=2) is acceptable on desktops with multiple network interfaces.
hardening.rp_filter_disabled   = info

# --- IPv6 -------------------------------------------------------------------

# Missing per-port (v6) rules are less critical on a desktop behind NAT
# when UFW is actively managing IPv6 (IPV6=yes).
ipv6.port_no_v6_rule                = info
# ipv6.ufw_disabled_listeners_present is NOT overridden here:
# UFW IPV6=no with active IPv6 listeners is a real bypass regardless of profile.

# --- SSH --------------------------------------------------------------------

# Password authentication is often intentional on a local desktop (single user,
# private network). Key-based auth is recommended but not enforced here.
ssh.password_auth         = info

# X11 forwarding is the native display model on desktop — expected, not a risk.
ssh.x11.forwarding.server        = info

# TCP forwarding (tunneling) is a common desktop use case (e.g. port forwards).
ssh.allow_tcp_forwarding  = info

# --- Rootkit scanner --------------------------------------------------------

# Rootkit scans are less critical on a personal desktop not exposed to the internet.
# The tool is still recommended but an absent or stale scan is not penalised.
rootkit.no_scan           = info
rootkit.scan_old          = info

# --- Password policy --------------------------------------------------------

# A PAM quality module is less critical on a single-user desktop where the
# admin controls their own password directly.
password_policy.no_quality_module = info

# --- SSH (minor hardening) --------------------------------------------------

# MaxAuthTries=6 is a minor tuning recommendation — not a security gap on a
# personal desktop where the SSH attack surface is minimal.
ssh.max_auth_tries = info

# --- Hardening (network) ----------------------------------------------------

# Desktops are not routers — send_redirects is safe to ignore.
# Same rationale as rp_filter_disabled already overridden above.
hardening.send_redirects_enabled = info

# --- DDNS -------------------------------------------------------------------

# On a desktop with DDNS, open ports are already penalised via service checks
# (SSH, Nginx, etc.).  Flagging them again here is a double penalty.
ddns.warn = info

# --- Local services ---------------------------------------------------------

# Avahi/mDNS is a normal desktop service for local network discovery (printers,
# file shares, Chromecast, etc.).  It is not internet-facing on a typical NAT
# setup and its exposure is expected, not a risk.
services.exposed.avahi = info

# Service exposed on a local subnet is the desktop's normal behaviour (LAN
# file shares, AirPlay, Chromecast). Keep the visibility but don't penalise.
services.exposure.open_local = info

# --- Antivirus (ClamAV) -----------------------------------------------------
#
# T6 (v0.8.1): on a personal desktop the AV is mostly defence-in-depth for
# files arriving by USB / download; the threat model differs from an
# internet-facing server. The OK paths and recent-scan paths still surface
# but stale signatures / old scans don't deduct points.
clamav.db_outdated      = info
clamav.db_very_outdated = info
clamav.scan_old         = info
clamav.scan_very_old    = info
clamav.no_scan_log      = info

# --- Rootkit (continued) ----------------------------------------------------
# T6 (v0.8.1): rootkit.no_scan + scan_old already overridden above; add the
# signature-database age finding for consistency with clamav.* — stale rkhunter
# signatures on a desktop are an INFO, not a real risk.
rootkit.db_outdated = info

# --- Audit subsystem (auditd) -----------------------------------------------
#
# T6 (v0.8.1): auditd is primarily a compliance + forensics tool for servers.
# A personal desktop without auditd is the norm; absent rules don't represent
# a real risk for the desktop threat model. Stays visible as INFO.
auditd.service_inactive          = info
auditd.no_rules                  = info
auditd.missing_sensitive_rules   = info

# --- Secure Boot ------------------------------------------------------------
#
# T6 (v0.8.1): Secure Boot is commonly disabled on desktops with NVIDIA
# proprietary drivers, dual-boot setups (Linux + Windows), or custom kernels.
# Visible as INFO; users who do want it enabled can flag --strict-cis later.
secure_boot.disabled    = info
secure_boot.setup_mode  = info

# --- File integrity (AIDE / Tripwire) ---------------------------------------
#
# T6 (v0.8.1): AIDE / Tripwire are server / compliance-tier tools. Desktop
# users almost never run them and shouldn't be penalised for their absence
# or for stale databases.
file_integrity.no_check  = info
file_integrity.no_db     = info
file_integrity.check_old = info

# --- Log rotation -----------------------------------------------------------
#
# T6 (v0.8.1): volatile journald + missing logrotate are operational concerns
# that matter on servers (retention for forensics). On a desktop the disk
# pressure trade-off is reasonable and the audit log retention need is low.
log_rotation.journald_volatile = info
log_rotation.logrotate_missing = info

# --- Backup -----------------------------------------------------------------
#
# T6 (v0.8.1): backup hygiene on a personal desktop is a personal-choice
# matter (cloud sync, external drive, none-and-accept-loss). Visible as INFO
# without dropping the score.
backup.no_backup = info

# --- MAC policy (AppArmor / SELinux) ----------------------------------------
#
# T6 (v0.8.1): AppArmor in complain-only mode (a couple of profiles in
# complain) is the default on Ubuntu/Mint desktops. Flag as INFO; absence of
# AppArmor entirely (apparmor_inactive) is still WARN — that's the real gap.
mac_policy.apparmor_no_enforce = info

# --- Password policy (continued) --------------------------------------------
#
# T6 (v0.8.1): minlen below CIS recommendation is a single-user-system minor
# tuning, not a real risk on a personal desktop.
password_policy.weak_minlen = info

# --- Firewall stack ---------------------------------------------------------
#
# T6 (v0.8.1): net.ipv4.ip_forward=1 is the normal state on a desktop running
# libvirt/KVM, Docker, or any VPN client (WireGuard, OpenVPN, Tailscale). The
# finding stays informative but doesn't penalise the score.
firewall_drivers.ip_forward_enabled = info

# --- SSH (continued minor hardening) ----------------------------------------
#
# T6 (v0.8.1): minor SSH hardening recommendations that match CIS L2 but aren't
# meaningful on a desktop where SSH (if enabled at all) is for personal use.
#
# Note (v0.8.1 T32): ``ssh.x11_use_localhost`` was originally in this list but
# is not currently emitted by any check — removed to avoid a dead override that
# would trigger the typo-detection warning added in v0.8.1.
ssh.login_grace_time      = info
