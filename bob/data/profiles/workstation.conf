# T6 (v0.8.1) — workstation is a first-class profile.
#
# History: from v0.1.0 until v0.8.0, ``bob -p workstation`` was a backward-compat
# alias that silently redirected to ``desktop`` (see the comment now removed
# from ``bob/profiles.py::load_profile``). That alias has been retired in
# v0.8.1 so this file actually loads.
#
# Migration: users who previously ran ``bob -p workstation`` got desktop's
# overrides. v0.8.1 ships a distinct ``workstation`` profile that keeps
# backup.no_backup / auditd.* / mac_policy.apparmor_no_enforce at the
# default WARN (business-tier semantics) while relaxing the same SSH /
# clamav / rootkit / file_integrity / log_rotation / secure_boot ergonomics
# as desktop. If you need the old behaviour (workstation == desktop), drop a
# copy of ``desktop.conf`` at ``~/.config/bob/profiles/workstation.conf``.

[profile]
name        = workstation
extends     = server
description = Business workstation — relaxed personal-use hardening, compliance/backup retained

[overrides]
# --- Updates & hardening ----------------------------------------------------

# unattended-upgrades is not the standard update mechanism on desktop systems
# (mintupdate, pop-upgrade, GNOME Software, etc. are used instead).
updates.unattended_not_configured = info

# Loose rp_filter (=2) is acceptable on desktops with multiple network interfaces.
hardening.rp_filter_disabled   = info

# Desktops are not routers — send_redirects is safe to ignore.
hardening.send_redirects_enabled = info

# --- IPv6 -------------------------------------------------------------------

# Missing per-port (v6) rules are less critical on a desktop behind NAT
# when UFW is actively managing IPv6 (IPV6=yes).
ipv6.port_no_v6_rule                = info
# ipv6.ufw_disabled_listeners_present is NOT overridden: real bypass regardless of profile.

# --- SSH --------------------------------------------------------------------
#
# T6 (v0.8.1): SSH on a business workstation is mostly used to reach servers,
# not to be a server. The same relaxations as `desktop` apply for the local
# SSH server if any.
ssh.password_auth         = info
ssh.x11_forwarding        = info
ssh.allow_tcp_forwarding  = info
ssh.max_auth_tries        = info
ssh.login_grace_time      = info
# Note (v0.8.1 T32): ``ssh.x11_use_localhost`` removed — not emitted by any check.

# --- Antivirus (ClamAV) -----------------------------------------------------
#
# T6 (v0.8.1): a business workstation typically runs an external EPP/EDR
# (CrowdStrike, SentinelOne, Defender, etc.); ClamAV hygiene is secondary.
# Mirrors the desktop relaxation.
clamav.db_outdated      = info
clamav.db_very_outdated = info
clamav.scan_old         = info
clamav.scan_very_old    = info
clamav.no_scan_log      = info

# --- Rootkit ----------------------------------------------------------------
#
# T6 (v0.8.1): rkhunter is mostly server gear; workstation EPP covers similar
# territory. Stays visible as INFO.
rootkit.no_scan      = info
rootkit.scan_old     = info
rootkit.db_outdated  = info

# --- Password policy --------------------------------------------------------
#
# T6 (v0.8.1): single-user workstation — pam_pwquality is often delegated to
# corporate IAM (AD, Okta). Local PAM module absence is not a real risk.
password_policy.no_quality_module = info
password_policy.weak_minlen       = info

# --- Secure Boot ------------------------------------------------------------
#
# T6 (v0.8.1): workstations with NVIDIA proprietary drivers / custom kernels
# routinely have Secure Boot off. Visible as INFO, not a deduction.
secure_boot.disabled    = info
secure_boot.setup_mode  = info

# --- File integrity (AIDE / Tripwire) ---------------------------------------
#
# T6 (v0.8.1): file integrity baselining is server / compliance tier — most
# business workstations don't run AIDE/Tripwire and shouldn't be penalised.
file_integrity.no_check  = info
file_integrity.no_db     = info
file_integrity.check_old = info

# --- Log rotation -----------------------------------------------------------
#
# T6 (v0.8.1): journald + logrotate hygiene matters for servers (forensics).
# A workstation with short retention is reasonable.
log_rotation.journald_volatile = info
log_rotation.logrotate_missing = info

# --- DDNS / local services --------------------------------------------------

# DDNS double-penalty same rationale as desktop.
ddns.warn = info

# Avahi/mDNS is normal for printer / share discovery in office environments.
services.exposed.avahi       = info
services.exposure.open_local = info

# --- Firewall stack ---------------------------------------------------------
#
# T6 (v0.8.1): ip_forward=1 is normal on a workstation running corporate VPN
# clients, dev VMs (libvirt/Docker), etc.
firewall_drivers.ip_forward_enabled = info

# --- NOT relaxed on workstation (kept at default WARN) ----------------------
#
# These remain WARN because a business workstation IS subject to compliance
# and corporate audit-trail expectations even though it's "personal":
#   - backup.no_backup         → workstation data loss is a real business risk
#   - auditd.*                 → corporate forensics / compliance retains value
#   - mac_policy.apparmor_*    → endpoint hardening still relevant in office
#   - file_integrity stays INFO above only because AIDE/Tripwire are rarely
#     deployed in the workstation tier; corporate EDR handles this concern
