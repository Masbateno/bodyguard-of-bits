[profile]
name        = container
extends     = desktop
description = Container/CI environment — host-level checks skipped, minimal footprint assumed

[skip_sections]
# Containers share the host kernel — kernel-level checks are irrelevant and
# would produce false positives or misleading results.
hardening
kernel_modules
kernel_hardening
secure_boot
auditd
suid_audit
# Docker-in-Docker is an edge case; when auditing a container, the host's
# Docker daemon is not accessible from inside the container.
docker_hardening

# Intrusion detection / integrity tools are meaningless in ephemeral containers:
# the filesystem is rebuilt on every run, so baselines and scan history have no value.
rootkit
file_integrity

# Storage and memory are managed by the container orchestrator (Docker, Podman,
# Kubernetes…) — disk health and swap policy are host concerns, not container concerns.
disk
memory

# fail2ban requires systemd and persistent state — not applicable in containers.
fail2ban

# Antivirus scanning is not applicable in containers (stateless, no email, no downloads).
clamav

# NTP is provided by the host — containers inherit the host clock.
ntp

# MAC policy (AppArmor/SELinux) is enforced by the host — the container sees
# the host's profiles but cannot manage them. Checking inside a container
# produces misleading results.
mac_policy

# Backup is an orchestrator/host concern — containers are ephemeral by design
# and do not manage their own backup lifecycle.
backup
