[build-system]
# setuptools>=77 required for PEP 639 native support (license SPDX + license-files).
# `wheel` is auto-resolved by setuptools.build_meta since setuptools ~70 — no need to list it.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bodyguard-of-bits"
version = "0.10.1"
description = "BOB — Bodyguard Of Bits: Linux hardening auditor with CIS benchmark mapping"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Cédric Clauzel", email = "cedricclauzel@mailo.com"},
]
maintainers = [
    {name = "Cédric Clauzel", email = "cedricclauzel@mailo.com"},
]
keywords = ["security", "audit", "linux", "firewall", "hardening", "cis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: System :: Systems Administration",
]

# Zero runtime deps outside stdlib — foundational architectural decision (see
# DOCUMENTS/SNAPSHOT.md "Kept" section). Preserve at all costs.
dependencies = []

[project.optional-dependencies]
# IP geolocation in `bob/checks/logs.py` brute-force detection. Conditional
# `try: import geoip2.database` with silent fallback if absent — installing
# the extra simply unlocks the country/city annotations in UFW log analysis.
#   pipx install "bodyguard-of-bits[geoip]"
#   pipx inject bodyguard-of-bits geoip2     # equivalent if already installed
geoip = ["geoip2>=4.0"]

[project.scripts]
bob = "bob.__main__:main"

[project.urls]
Homepage      = "https://github.com/Masbateno/bodyguard-of-bits"
Source        = "https://github.com/Masbateno/bodyguard-of-bits"
Documentation = "https://github.com/Masbateno/bodyguard-of-bits/blob/main/DOCUMENTS/README_TECH.md"
Issues        = "https://github.com/Masbateno/bodyguard-of-bits/issues"
Changelog     = "https://github.com/Masbateno/bodyguard-of-bits/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
# CRITICAL (v0.6.2 hotfix): use a glob so subpackages added in future
# refactors (ssh/, cron/ in v0.6.0) are auto-included in the wheel. The
# previous explicit list `["bob", "bob.checks", "bob.tui"]` did NOT include
# `bob.checks.ssh` or `bob.cron` — the v0.6.0 splits produced wheels that
# crashed at import time on every pipx-installed system with:
#   ModuleNotFoundError: No module named 'bob.checks.ssh'
# The "bob*" pattern matches bob, bob.checks, bob.checks.ssh, bob.cron, etc.
# but still excludes top-level non-bob directories (tests/, DOCUMENTS/, etc.).
include = ["bob*"]

[tool.setuptools.package-data]
bob = [
    "data/*",
    "data/profiles/*.conf",
    "data/schemas/*.json",
    "locales/*.json",
]
