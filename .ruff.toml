# v0.13.3 — correctness-only lint gate.
#
# Deliberately NOT a style checker: no line-length (E501), no import sorting
# (I), no naming (N), no pyupgrade (UP). Enabling those on a ~33 kLoC
# codebase would produce hundreds of cosmetic diffs for no defect caught,
# which is exactly the churn this project refuses.
#
# What is enabled is the class of bug that 6500 behavioural tests cannot
# see: names that do not resolve, imports shadowed inside a function
# (the v0.8.3 `UnboundLocalError` shipped to PyPI), f-strings that lost
# their placeholders, and mutable-default / blind-except footguns.
target-version = "py310"

[lint]
select = ["E9", "F", "B"]

# Deferred, not waived — both are real signals whose fixes change runtime
# behaviour, which does not belong in a patch release:
#   B904  `raise ... from err` inside except — 4 sites (_sandbox, cli). Alters
#         exception chaining and the traceback users see on a CLI error.
#   B905  `zip(strict=)` — 1 site (cron/_parse). Turning it on makes a length
#         mismatch raise where it currently truncates silently.
# Revisit in v0.14.0 alongside the other behaviour-affecting changes.
ignore = ["B904", "B905"]


# NOTE: no [lint.per-file-ignores] block on purpose. The v0.6.0 re-export
# shims (bob/cron/__init__.py, bob/checks/ssh/__init__.py) and the three
# monkeypatch seams (_run in backup/clamav/log_rotation) carry an inline
# `# noqa: F401` that says *why* the import is kept. A per-file ignore would
# be strictly worse: it documents nothing and makes the whole file blind to
# F401, so a genuinely dead import added later would never be reported.
